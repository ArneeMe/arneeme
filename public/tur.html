<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tur · arnee.me</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root { --bg: #f4f4f0; --flate: #ffffff; --kant: #c6c6c0; --tekst: #171716; --dempet: #6a6a65; --aksent: #9a4a00; --paa-aksent: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e0e0d; --flate: #171716; --kant: #2f2f2c; --tekst: #e4e4df; --dempet: #9a9a94; --aksent: #f0a040; --paa-aksent: #0e0e0d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tekst); font: 15px/1.5 ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 26px; margin: 8px 0 0; overflow-wrap: anywhere; }
  .dempet { color: var(--dempet); }
  #kart { height: 60vh; min-height: 320px; border: 2px solid var(--kant); border-radius: 2px; background: var(--flate); }
  .knapper { display: flex; flex-direction: column; gap: 8px; }
  [hidden] { display: none !important; }
  a.knapp, button.knapp { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 8px 16px; border: 2px solid var(--kant); border-radius: 2px; background: var(--bg); color: var(--tekst); text-decoration: none; font: inherit; cursor: pointer; }
  a.knapp.hoved { background: var(--aksent); border-color: var(--aksent); color: var(--paa-aksent); font-weight: 700; }
  footer { font-size: 12px; }
  footer a { color: var(--dempet); }
</style>
</head>
<body>
<main>
  <h1 id="navn">Tur</h1>
  <div id="info" class="dempet"></div>
  <div id="kart"></div>
  <div class="knapper" id="knapper">
    <a class="knapp hoved" id="apne">Åpne i Tur</a>
    <button class="knapp" id="gpx" type="button">Last ned GPX</button>
    <a class="knapp" id="mote">Vis startpunktet i kartappen</a>
  </div>
  <footer class="dempet">Ruta ligger i selve lenken og sendes ikke til noen server. Kart fra Kartverket. <a href="/">arnee.me</a></footer>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  const felt = Object.fromEntries(location.hash.slice(1).split("&").filter(Boolean).map(d => [d.split("=")[0], d.slice(d.indexOf("=") + 1)]));
  const navn = decodeURIComponent(felt.n || "Tur");
  document.title = navn + " · arnee.me";
  document.getElementById("navn").textContent = navn;

  function punkter(data) {
    const b64 = data.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((data.length + 3) % 4);
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const tall = [];
    let i = 0;
    while (i < bytes.length) {
      let verdi = 0n, skift = 0n, b;
      do {
        b = bytes[i++];
        verdi |= BigInt(b & 0x7f) << skift;
        skift += 7n;
      } while (b >= 0x80 && i < bytes.length);
      tall.push(Number((verdi >> 1n) ^ -(verdi & 1n)));
    }
    const ut = [];
    let la = 0, lo = 0;
    for (let j = 0; j + 1 < tall.length; j += 2) {
      la += tall[j];
      lo += tall[j + 1];
      ut.push([la / 1e5, lo / 1e5]);
    }
    return ut;
  }

  function avstand(a, b) {
    const r = Math.PI / 180;
    const h = Math.sin((b[0] - a[0]) * r / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin((b[1] - a[1]) * r / 2) ** 2;
    return 2 * 6371000 * Math.asin(Math.sqrt(h));
  }

  let p = [];
  try { p = felt.p ? punkter(felt.p) : []; } catch (e) { p = []; }

  if (p.length < 2) {
    document.getElementById("info").textContent = "Fant ingen tur i lenken.";
    document.getElementById("knapper").hidden = true;
    document.getElementById("kart").hidden = true;
  } else {
    let meter = 0;
    for (let j = 1; j < p.length; j++) meter += avstand(p[j - 1], p[j]);
    const rundtur = avstand(p[0], p[p.length - 1]) < 100;
    document.getElementById("info").textContent = (meter / 1000).toFixed(2).replace(".", ",") + " km" + (rundtur ? " · rundtur" : "");

    const kart = L.map("kart");
    L.tileLayer("https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png", { maxZoom: 18, attribution: "© Kartverket" }).addTo(kart);
    const aksent = getComputedStyle(document.documentElement).getPropertyValue("--aksent").trim();
    const linje = L.polyline(p, { color: aksent, weight: 5, opacity: 0.9 }).addTo(kart);
    L.circleMarker(p[0], { radius: 8, color: "#ffffff", weight: 3, fillColor: aksent, fillOpacity: 1 }).addTo(kart).bindTooltip("Start", { permanent: true, direction: "right" });
    kart.fitBounds(linje.getBounds(), { padding: [20, 20] });

    document.getElementById("apne").href = "me.arnee.tur://rute" + location.hash;
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
    const [la, lo] = p[0];
    document.getElementById("mote").href = ios
      ? `https://maps.apple.com/?ll=${la},${lo}&q=${encodeURIComponent("Start: " + navn)}`
      : `geo:${la},${lo}?q=${la},${lo}(${encodeURIComponent("Start: " + navn)})`;
    if (!/Android/.test(navigator.userAgent)) document.getElementById("apne").hidden = true;

    document.getElementById("gpx").onclick = () => {
      const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="arnee.me" xmlns="http://www.topografix.com/GPX/1/1">\n <trk><name>${esc(navn)}</name><trkseg>\n${p.map(q => `  <trkpt lat="${q[0]}" lon="${q[1]}"/>`).join("\n")}\n </trkseg></trk>\n</gpx>\n`;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([gpx], { type: "application/gpx+xml" }));
      a.download = (navn.replace(/[^\p{L}\p{N} _-]/gu, "").trim() || "tur") + ".gpx";
      a.click();
    };
  }
</script>
</body>
</html>
